name: Build Atomik OS Hypervisor

# Variante hypervisor: deriva da atomik-desktop (FROM ghcr.io/giurest/atomik-desktop:latest).
# Workflow separato con ciclo di vita indipendente:
#  - push sui file hypervisor  → rebuild mirato
#  - schedule mensile          → riallinea alla base desktop aggiornata
#  - workflow_dispatch         → build manuale
on:
  push:
    branches:
      - main
    paths:
      - "containerfiles/Containerfile.hypervisor"
      - "build_files_hypervisor/**"
      - "files/system/etc/polkit-1/rules.d/50-libvirt-wheel.rules"
      - "files/fastfetch/hypervisor.jsonc"
      - ".github/workflows/build-hypervisor.yml"
      # ujust: entrypoint + TUTTI i moduli importati
      - "files/ujust/entrypoint-hypervisor.just"
      - "files/ujust/hypervisor.just"
      - "files/ujust/common.just"
      - "files/ujust/environment.just"
      # provisioning libvirt
      - "files/system/usr/bin/atomik-libvirt-provision"
      - "files/system/usr/lib/systemd/system/atomik-libvirt-provision.service"
      - "files/system/usr/share/atomik/libvirt/**"
      # template cloud-init VM
      - "files/system/usr/share/atomik/cloud-init/**"
      # script vm helper
      - "files/system/usr/libexec/atomik/**"
  schedule:
    # update 2026-11-07 - build every Sunday 
    - cron: "0 3 * * 0"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-hypervisor:
    name: Build hypervisor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@cf1e78c50ca91e757bab3edc229027eebfc07871 # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REGISTRY }}/atomik-hypervisor
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: atomik-hypervisor
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          containerfiles: ./containerfiles/Containerfile.hypervisor
          oci: true

      - name: Push image
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push
        with:
          tags: ${{ steps.build.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request'

      - name: Sign the image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ env.IMAGE_REGISTRY }}/atomik-hypervisor@${{ steps.push.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: true
