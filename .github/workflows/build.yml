name: Build Atomik OS Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "tools/**"
      # server (catena separata)
      - "containerfiles/Containerfile.server"
      - "build_files_server/**"
      - "files/ujust/server.just"
      - ".github/workflows/build-server.yml"
      - ".github/workflows/build-server-qcow2.yml"
      # hypervisor (catena separata)
      - "containerfiles/Containerfile.hypervisor"
      - "build_files_hypervisor/**"
      - "files/system/etc/polkit-1/rules.d/50-libvirt-wheel.rules"
      - "files/fastfetch/hypervisor.jsonc"
      - ".github/workflows/build-hypervisor.yml"
      - "files/ujust/entrypoint-hypervisor.just"
      - "files/ujust/hypervisor.just"
      # provisioning + template VM (solo hypervisor)
      - "files/system/usr/bin/atomik-libvirt-provision"
      - "files/system/usr/lib/systemd/system/atomik-libvirt-provision.service"
      - "files/system/usr/share/atomik/libvirt/**"
      - "files/system/usr/share/atomik/cloud-init/**"
      - "files/system/usr/libexec/atomik/**"
      # container applicativi (catena separata)
      - "containerapps/**"
      - ".github/workflows/build-php.yml"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "tools/**"
      # server (catena separata)
      - "containerfiles/Containerfile.server"
      - "build_files_server/**"
      - "files/ujust/server.just"
      - ".github/workflows/build-server.yml"
      - ".github/workflows/build-server-qcow2.yml"
      # hypervisor (catena separata)
      - "containerfiles/Containerfile.hypervisor"
      - "build_files_hypervisor/**"
      - "files/system/etc/polkit-1/rules.d/50-libvirt-wheel.rules"
      - "files/fastfetch/hypervisor.jsonc"
      - ".github/workflows/build-hypervisor.yml"
      - "files/ujust/entrypoint-hypervisor.just"
      - "files/ujust/hypervisor.just"
      # provisioning + template VM (solo hypervisor)
      - "files/system/usr/bin/atomik-libvirt-provision"
      - "files/system/usr/lib/systemd/system/atomik-libvirt-provision.service"
      - "files/system/usr/share/atomik/libvirt/**"
      - "files/system/usr/share/atomik/cloud-init/**"
      - "files/system/usr/libexec/atomik/**"
      # container applicativi (catena separata)
      - "containerapps/**"
      - ".github/workflows/build-php.yml"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Fase 1: immagine base desktop ──────────────────────────────────────────
  build-base:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        variant:
          - desktop

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_REGISTRY }}/atomik-${{ matrix.variant }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: atomik-${{ matrix.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          containerfiles: ./containerfiles/Containerfile.${{ matrix.variant }}
          oci: true

      - name: Push image
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push
        with:
          tags: ${{ steps.build.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        if: github.event_name != 'pull_request'

      - name: Sign the image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ env.IMAGE_REGISTRY }}/atomik-${{ matrix.variant }}@${{ steps.push.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: true

  # ── Fase 2: varianti derivate da desktop ───────────────────────────────────
  build-derived:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    needs: build-base
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        variant:
          - puregaming
          - desktop-nvidia

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_REGISTRY }}/atomik-${{ matrix.variant }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: atomik-${{ matrix.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          containerfiles: ./containerfiles/Containerfile.${{ matrix.variant }}
          oci: true

      - name: Push image
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push
        with:
          tags: ${{ steps.build.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        if: github.event_name != 'pull_request'

      - name: Sign the image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ env.IMAGE_REGISTRY }}/atomik-${{ matrix.variant }}@${{ steps.push.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: true

  # ── Fase 3: varianti derivate da desktop-nvidia ────────────────────────────
  build-nvidia-derived:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    needs: build-derived
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        variant:
          - puregaming-nvidia

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_REGISTRY }}/atomik-${{ matrix.variant }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: atomik-${{ matrix.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          containerfiles: ./containerfiles/Containerfile.${{ matrix.variant }}
          oci: true

      - name: Push image
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push
        with:
          tags: ${{ steps.build.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        if: github.event_name != 'pull_request'

      - name: Sign the image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ env.IMAGE_REGISTRY }}/atomik-${{ matrix.variant }}@${{ steps.push.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: true
